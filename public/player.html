<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Геополитика — Пульт Игрока</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: sans-serif; margin: 0; padding: 15px; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: white; font-size: 1rem; box-sizing: border-box; }
    button { background: #1f6feb; border: none; font-weight: bold; cursor: pointer; }
    .mission-box { background: #21262d; border-left: 4px solid #d29922; padding: 10px; margin-bottom: 15px; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { padding: 16px 8px; background: #21262d; border: 1px solid #30363d; }
    .action-btn.selected { background: #238636; border-color: #2ea043; }
    .chat-box { margin-top: 20px; border-top: 1px solid #30363d; padding-top: 15px; }
    #chat-messages { height: 140px; overflow-y: auto; background: #161b22; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="login-screen">
    <h2>Вход в игру</h2>
    <input type="text" id="country-name" placeholder="Название вашей страны..." />
    <button onclick="joinGame()">Войти</button>
  </div>

  <div id="game-screen" class="hidden">
    <h3 id="my-title" style="margin-top:0;"></h3>
    <div class="mission-box">
      <strong>🕵️ Секретная миссия:</strong>
      <div id="my-mission"></div>
    </div>

    <div id="status-alert" style="color:#f85149; margin-bottom:10px; font-weight:bold;"></div>

    <label>Цель (для Пакта, Санкций, Запуска или Теневого щита):</label>
    <select id="target-select"></select>

    <div id="alive-actions" class="grid">
      <button class="action-btn" onclick="sendAction('reform', this)">⚡️ Реформа (+2 вл.)</button>
      <button class="action-btn" onclick="sendAction('rocket', this)">🚀 Ракета (+1)</button>
      <button class="action-btn" onclick="sendAction('shield', this)">🛡 Скрытый Щит</button>
      <button class="action-btn" onclick="sendAction('pact', this)">🤝 Пакт с целью</button>
      <button class="action-btn" onclick="sendAction('sanctions', this)">🚫 Санкции цели</button>
      <button class="action-btn" onclick="sendAction('launch', this)">💥 Запуск в цель</button>
    </div>

    <div id="dead-actions" class="hidden">
      <button class="action-btn" onclick="sendAction('shadow_shield', this)">🕶 Дать Теневой Щит выбранной цели</button>
    </div>

    <div class="chat-box">
      <h4>💬 Закрытый дипломатический канал</h4>
      <div id="chat-messages"></div>
      <select id="chat-target"></select>
      <input type="text" id="chat-input" placeholder="Тайное сообщение..." />
      <button onclick="sendChat()">Отправить шифровку</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myId = null;

    function joinGame() {
      const name = document.getElementById('country-name').value;
      socket.emit('join_game', name);
    }

    socket.on('joined', (data) => {
      myId = data.id;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('my-title').innerText = `Держава: ${data.name}`;
      document.getElementById('my-mission').innerText = data.mission;
    });

    socket.on('state_update', (state) => {
      if (!myId) return;
      const me = state.players.find(p => p.id === myId);
      const others = state.players.filter(p => p.id !== myId);

      // Обновление статуса жизни и санкций
      const alertBox = document.getElementById('status-alert');
      if (!me.alive) {
        alertBox.innerText = 'Страна разрушена! Вы — Теневое правительство.';
        document.getElementById('alive-actions').classList.add('hidden');
        document.getElementById('dead-actions').classList.remove('hidden');
      } else if (me.sanctioned) {
        alertBox.innerText = '🚫 Вы под санкциями и пропускаете этот ход!';
      } else {
        alertBox.innerText = `⚡️ Влияние: ${me.influence} | 🚀 Ракеты: ${me.rockets}`;
      }

      // Обновление списков игроков для целей и чата
      const targetSelect = document.getElementById('target-select');
      const chatSelect = document.getElementById('chat-target');
      const prevTarget = targetSelect.value;
      const prevChat = chatSelect.value;

      targetSelect.innerHTML = '';
      chatSelect.innerHTML = '';

      others.forEach(o => {
        if (o.alive) {
          const opt1 = new Option(o.name, o.id);
          targetSelect.add(opt1);
        }
        const opt2 = new Option(o.name, o.id);
        chatSelect.add(opt2);
      });

      if (prevTarget) targetSelect.value = prevTarget;
      if (prevChat) chatSelect.value = prevChat;
    });

    function sendAction(type, btnElement) {
      const targetId = document.getElementById('target-select').value;
      socket.emit('submit_action', { type, targetId });
      document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');
    }

    socket.on('turn_resolved', () => {
      document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('chat-messages').innerHTML = '<em>--- Новый ход: архивы чата очищены ---</em><br>';
    });

    function sendChat() {
      const toId = document.getElementById('chat-target').value;
      const input = document.getElementById('chat-input');
      if (!toId || !input.value) return;
      socket.emit('private_message', { toId, text: input.value });
      input.value = '';
    }

    socket.on('chat_message', (msg) => {
      const box = document.getElementById('chat-messages');
      box.innerHTML += `<div><strong>${msg.fromName} → ${msg.toName}:</strong> ${msg.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    socket.on('error_msg', (err) => alert(err));
  </script>
</body>
</html>
